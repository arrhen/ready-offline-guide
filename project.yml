name: Ready
options:
  bundleIdPrefix: com.arrhen
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ReadyCore:
    path: Packages/ReadyCore
targets:
  Ready:
    type: application
    platform: iOS
    sources: [App/Ready]
    dependencies:
      - package: ReadyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arrhen.ready
        PRODUCT_NAME: Ready
        INFOPLIST_KEY_CFBundleDisplayName: Ready
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
      configs:
        # The Best tier needs more memory than iOS normally allows an app. The capability needs a
        # paid developer account, so Debug builds (including free Personal Teams) leave it out.
        Release:
          CODE_SIGN_ENTITLEMENTS: App/Ready/Ready.entitlements
