name: Ready
options:
  bundleIdPrefix: com.arrhen
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ReadyCore:
    path: Packages/ReadyCore
schemes:
  Ready:
    build:
      targets:
        Ready: all
    run:
      storeKitConfiguration: App/Ready/Ready.storekit
    test:
      targets: []
targets:
  Ready:
    type: application
    platform: iOS
    preBuildScripts:
      - name: Release checks (archive only)
        script: |
          # Runs scripts/check-release.sh when archiving, so an archive cannot ship unreviewed guides or
          # a model path that can reach the network. Normal builds skip it.
          if [ "$ACTION" = "install" ]; then
            "$SRCROOT/scripts/check-release.sh"
          fi
        basedOnDependencyAnalysis: false
    sources:
      - path: App/Ready
        excludes:
          - Ready.storekit   # local test products; the scheme uses it, the app must not ship it
    dependencies:
      - package: ReadyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arrhen.ready
        PRODUCT_NAME: Ready
        INFOPLIST_KEY_CFBundleDisplayName: Ready
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
      # The increased-memory-limit entitlement (App/Ready/Ready.entitlements) is for the 4B model on 8 GB
      # phones. Release builds have no model yet, so they do not request it. Restore this block when
      # models ship, and enable the capability for the App ID in the developer portal first:
      #   configs:
      #     Release:
      #       CODE_SIGN_ENTITLEMENTS: App/Ready/Ready.entitlements
